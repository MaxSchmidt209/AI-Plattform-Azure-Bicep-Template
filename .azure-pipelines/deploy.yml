trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**

variables:
  - group: ai-platform-secrets
  - name: resourceGroupName
    value: ingsoft-interwatt-azure-ai-resource-group

stages:
  - stage: Validate
    displayName: Validate (What-If)
    jobs:
      - job: WhatIf
        displayName: What-If Deployment
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Run What-If
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az bicep version
                az deployment group what-if \
                  --resource-group "$(resourceGroupName)" \
                  --template-file "$(Build.SourcesDirectory)/infra/main.bicep" \
                  --parameters "$(Build.SourcesDirectory)/infra/main.bicepparam"

  - stage: Deploy
    displayName: Deploy Infrastructure
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Deploy to Resource Group
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Deploy Bicep
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment group create \
                  --resource-group "$(resourceGroupName)" \
                  --template-file "$(Build.SourcesDirectory)/infra/main.bicep" \
                  --parameters "$(Build.SourcesDirectory)/infra/main.bicepparam"
